# Render Blueprint — AutoCare360 API
# Render → New → Blueprint → select this repository. Secrets marked `sync: false`
# are prompted for in the dashboard; they are never stored in this file.
services:
  - type: web
    name: autocare360-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      # Vercel rewrite (client/vercel.json) → Render load balancer → app
      - key: TRUST_PROXY
        value: "2"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
